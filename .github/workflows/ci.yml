name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python -m coverage run --branch --source=rdfcore -m pytest
      - run: python -m coverage report --fail-under=70
      - name: Save coverage report
        if: always()
        run: python -m coverage json -o "${{ runner.temp }}/coverage.json"
      - name: Require 70% line coverage
        run: >-
          python -c "import json, os; from pathlib import Path;
          t=json.loads(Path(os.environ['RUNNER_TEMP'], 'coverage.json').read_text())['totals'];
          assert t['covered_lines'] >= 0.7*t['num_statements'], 'Line coverage is below 70%'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/coverage.json
      - name: Record API inventory and scoped compatibility evidence
        run: python -m benchmarks.audit_api > "${{ runner.temp }}/api-inventory.json"
      - uses: actions/upload-artifact@v4
        with:
          name: api-inventory-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/api-inventory.json
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tests/integration/check_distributions.py
      - name: Install and verify both distributions outside checkout
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            python -m pip install --force-reinstall "$artifact"
            (cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/tests/integration/check_installed_package.py")
            python -m pip install "rdfcore[html]"
            (cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/tests/integration/check_installed_package.py")
          done
