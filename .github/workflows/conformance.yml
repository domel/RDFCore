name: W3C conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rdfcore/**"
      - "tests/w3c/**"
      - "tests/formats/**"
      - "pyproject.toml"
      - ".github/workflows/conformance.yml"
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  official-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[test]'
      - name: Read the reproducible W3C revision
        id: snapshot
        run: python -c "import tomllib; print('revision=' + tomllib.load(open('tests/w3c/manifest.lock', 'rb'))['commit'])" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: fixtures-cache
        with:
          path: .w3c/rdf-tests
          key: w3c-${{ runner.os }}-${{ steps.snapshot.outputs.revision }}
      - uses: actions/checkout@v4
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        with:
          repository: w3c/rdf-tests
          ref: ${{ steps.snapshot.outputs.revision }}
          path: .w3c/rdf-tests
          persist-credentials: false
      - name: Verify fixtures before caching or executing them
        id: fixture-verification
        run: python -c "from pathlib import Path; from tests.w3c.official import verify_checkout; verify_checkout(Path('.w3c/rdf-tests'))"
      - uses: actions/cache/save@v4
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        with:
          path: .w3c/rdf-tests
          key: w3c-${{ runner.os }}-${{ steps.snapshot.outputs.revision }}
      - name: Run all accounted suites
        run: python -m tests.w3c.official .w3c/rdf-tests --output .w3c/reports/current.json
      - name: Audit all observed issues without changing their status
        if: always()
        run: python -m tests.w3c.audit --current .w3c/reports/current.json --output .w3c/reports/audit.json
      - name: Summarize conformance results
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('.w3c/reports/current.json')
          if path.exists():
              report = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('Snapshot: `' + report['snapshot'] + '`\n\n')
                  output.write('| Version | Format | Passed | Failed | Unsupported | Error |\n')
                  output.write('| --- | --- | ---: | ---: | ---: | ---: |\n')
                  for suite in report['suites']:
                      counts = suite['counts']
                      output.write('| ' + suite['rdf_version'] + ' | ' + suite['format'] + ' | ' +
                          ' | '.join(str(counts[key]) for key in ('passed', 'failed', 'unsupported', 'error')) + ' |\n')
                  output.write('\nSuite errors: ' + str(sum(bool(s.get('suite_error')) for s in report['suites'])) + '\n')
                  output.write('\nPassed tests are not a complete conformance certification.\n')
                  audit_path = Path('.w3c/reports/audit.json')
                  if audit_path.exists():
                      audit = json.loads(audit_path.read_text())['audit']
                      output.write('\nIssues: ' + str(len(audit['issues'])) +
                          '; unreviewed: ' + str(audit['unreviewed']) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3c-conformance-results
          path: .w3c/reports/*.json
          if-no-files-found: error
