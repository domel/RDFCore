[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rdfcore"
version = "0.1.0.dev0"
description = "A lightweight RDF 1.1/1.2 library with an RDFLib-compatible API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = ["pytest", "rdflib==7.6.0", "html5rdf==1.2.1"]
html = ["html5rdf>=1.2.1,<2"]

[project.urls]
Repository = "https://github.com/domel/RDFCore"
Issues = "https://github.com/domel/RDFCore/issues"

[project.scripts]
rdfcore = "rdfcore.cli:main"

[tool.setuptools.packages.find]
include = ["rdfcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
